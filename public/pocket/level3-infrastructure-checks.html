<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>小本本</title>
  <link rel="stylesheet" href="./reader.css">
  <script src="./reader.js" defer></script>
</head>
<body>
<header>小本本</header>
<main>
  <p id="status" role="status">請使用完整的書籤網址開啟。</p>
  <noscript>閱讀文件需要啟用 JavaScript。</noscript>
  <div id="reader" hidden>
    <div class="tools">
      <a id="back">返回文件目錄</a>
      <a id="download">下載 Markdown</a>
    </div>
    <nav id="contents" aria-label="章節目錄" hidden>
      <details open>
        <summary>章節目錄</summary>
        <ul id="sections"></ul>
      </details>
    </nav>
    <article id="document"></article>
  </div>
</main>
</body>
</html>
